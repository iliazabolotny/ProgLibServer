services:
  postgres:
    image: postgres:latest
    container_name: database-container
    environment:
      POSTGRES_DB: "proglibdb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
     - postgres-data:/var/lib/postgresql/data
    ports:
    - "5432:5432"
volumes:
  pgdata: